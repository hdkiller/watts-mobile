packages:
  - '.'

allowBuilds:
  '@sentry/cli': true
  unrs-resolver: true

# nitro 0.36.3 is already in the lockfile (HealthKit); allow until the age gate clears
minimumReleaseAgeExclude:
  - react-native-nitro-modules@0.36.3

overrides:
  tar: '^7.5.22'
  undici: '^6.28.0'
  uuid: '^9.0.1'
  'brace-expansion@<1.1.11': '1.1.11'
  'brace-expansion@>=2.0.0 <2.0.1': '2.0.1'
