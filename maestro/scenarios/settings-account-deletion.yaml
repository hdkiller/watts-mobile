# Settings: navigate to settings, verify Subscription and Delete account affordances.
appId: com.coachwatts.app
---
- runFlow: ../subflows/tap-tab-more.yaml
- scrollUntilVisible:
    element:
      id: more-settings
    direction: DOWN
    timeout: 15000
- tapOn:
    id: more-settings
- extendedWaitUntil:
    visible:
      id: settings-screen
    timeout: 15000
- assertVisible: 'Subscription'
- assertVisible: 'Delete account'
