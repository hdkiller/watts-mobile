# Invite a friend QR — assumes authenticated session on hosted/local instance.
# The row lives in More → Account, below the training hubs, so scroll to it.
appId: com.coachwatts.app
---
- runFlow: ../subflows/tap-tab-more.yaml
- scrollUntilVisible:
    element:
      id: more-invite-friends
    direction: DOWN
    timeout: 15000
- tapOn:
    id: more-invite-friends
- extendedWaitUntil:
    visible:
      id: invite-screen
    timeout: 20000
- extendedWaitUntil:
    visible:
      id: invite-qr
    timeout: 20000
- assertVisible:
    id: invite-code
- assertVisible:
    id: invite-share
