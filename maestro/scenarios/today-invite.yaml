# Today name → Athlete → Invite friends — assumes authenticated hosted/local session.
appId: com.coachwatts.app
---
- extendedWaitUntil:
    visible:
      id: today-screen
    timeout: 45000
- tapOn:
    id: today-greeting-name
- extendedWaitUntil:
    visible:
      id: athlete-screen
    timeout: 20000
- scrollUntilVisible:
    element:
      id: athlete-invite-friends
    direction: DOWN
    timeout: 15000
- tapOn:
    id: athlete-invite-friends
- extendedWaitUntil:
    visible:
      id: invite-screen
    timeout: 20000
- extendedWaitUntil:
    visible:
      id: invite-qr
    timeout: 20000
